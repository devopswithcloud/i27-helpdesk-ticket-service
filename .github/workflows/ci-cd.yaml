name: Ticket Service CICD
run-name: Deploy to ${{ inputs.environment }} | by ${{ github.actor}} | branch ${{ github.ref_name}}
on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: choice
        options:
          - dev
          - test
          - stage
          - prod 
        default: dev 
      
env:
  IMAGE_NAME: devopswithcloudhub/i27helpdesk-ticket
  GCP_PROJECT_ID: project-297df0e3-3d6b-40a7-aab
  GKE_CLUSTER: i27helpdesk-cluster
  GKE_ZONE: us-east4-a

jobs:
  # ------------------------ Job 1 : Build and Test ------------------------
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build and test
        run: mvn clean package
  # ------------------------ Job 2 : Sonarqube Scans  ------------------------
  # ------------------------ Job 3 : Docker Build and Push ------------------------
  docker-build-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    # implement a if here to execute this block only if there is a commit change
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Docker Image Tag
        id: tag
        run: echo "value=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
            context: .
            push: true
            tags: |
                ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
  # ------------------------ Job 4 : Deploy to Dev ------------------------
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: docker-build-push
    env:
      NAMESPACE: i27helpdesk-${{ inputs.environment }}
      SECRET_NAME: i27-ticket-${{ inputs.environment }}
    environment: 
      name: ${{ inputs.environment}}
    permissions: 
      contents: read
      id-token: write # required for OIDC token google-github-actions/auth exchanged to gcp credentials
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Authenticate to GCP via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER}}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{env.GCP_PROJECT_ID}}
      # - name: Test GCloud Version
      #   run: gcloud --version
      # - name: vms list 
      #   run: gcloud compute instances list
      - name: Get GKE Credentials
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: ${{ env.GKE_CLUSTER}}
          location: ${{ env.GKE_ZONE }}
      - name: Nodes list 
        run: |
          kubectl get nodes
      - name: Set the image tag
        run: | 
          IMAGE="${{ env.IMAGE_NAME}}:${{ needs.docker-build-push.outputs.image_tag}}"
          sed -i "s|\${IMAGE}|${IMAGE}|g" k8s/deployment.yaml
          sed -i "s|\${SECRET_NAME}|${{ env.SECRET_NAME}}|g" k8s/deployment.yaml
      - name: Deploy the manifests
        run: |
          kubectl apply -n ${{ env.NAMESPACE }} -f k8s/deployment.yaml
          kubectl apply -n ${{ env.NAMESPACE }} -f k8s/service.yaml
      - name: Verify Rollout 
        run: |
          kubectl rollout status deployment/i27-ticket -n ${{ env.NAMESPACE }} --timeout=120s